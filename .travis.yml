sudo: required
dist: xenial
language: go
go:
- "1.11.x"
go_import_path: github.com/coreos/kube-prometheus
cache:
  directories:
  - $GOCACHE
  - $GOPATH/pkg/mod
services:
- docker
before_install:
  - pip install --user awscli
  - export PATH=$PATH:$HOME/.local/bin
jobs:
  include:
  - stage: Sanity check and tests
  # Check generated contents are up to date and code is formatted.
  - script: make test-in-docker
  # kube-prometheus e2e tests
  - script: ./tests/e2e/travis-e2e.sh
